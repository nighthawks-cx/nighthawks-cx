<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nighthawks CX</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#05050a;--panel:#0d0d18;--line:#26264a;--p:#7c3aed;--b:#3b82f6;--tx:#ececf6;--mu:#9a9ab8;--ok:#34d399;--bad:#f87171;--hd:'Rajdhani','Segoe UI',sans-serif;--bd:'Inter',system-ui,sans-serif;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 var(--bd)}
body{min-height:100vh}
h1,h2,h3,.brand{font-family:var(--hd);letter-spacing:.04em;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--b);outline-offset:2px}
.btn{min-height:44px;padding:0 20px;border:0;border-radius:8px;cursor:pointer;font-weight:600;background:linear-gradient(135deg,var(--p),var(--b));color:#fff;transition:transform .2s,box-shadow .2s}
.btn:hover{box-shadow:0 0 22px #7c3aed88;transform:translateY(-1px)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--tx)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn.bad{background:#7f1d1d}
label{display:block;font-size:14px;color:var(--mu);margin:12px 0 4px}
input,select,textarea{width:100%;min-height:44px;padding:10px 12px;background:#080812;border:1px solid var(--line);border-radius:8px}
textarea{min-height:80px}
.hide{display:none!important}
#auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(#05050acc,#05050aee),var(--bgimg) center/cover}
.card{width:100%;max-width:420px;background:#0d0d18ee;border:1px solid var(--line);border-radius:14px;padding:28px;box-shadow:0 0 60px #7c3aed33}
.logo{text-align:center;margin-bottom:8px}
.logo h1{font-size:44px;font-style:italic;background:linear-gradient(#fff,#b9b9d6);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 30px #7c3aed}
.logo small{letter-spacing:.5em;color:var(--mu);font-size:12px}
.tabs{display:flex;gap:8px;margin:16px 0}
.tabs button{flex:1}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:8px}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 24px;background:#05050af0;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{font-size:26px;font-style:italic;font-weight:700}.brand span{color:var(--p)}
nav{display:flex;gap:6px;flex:1;flex-wrap:wrap}
nav button{background:none;border:0;min-height:44px;padding:0 14px;border-radius:8px;color:var(--mu);cursor:pointer;font-weight:500}
nav button.on,nav button:hover{color:#fff;background:#7c3aed33}
.role{font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--p);color:#c4b5fd;text-transform:uppercase;letter-spacing:.1em}
.role.admin{border-color:var(--b);color:#93c5fd;background:#3b82f622}
.hero{padding:48px 24px;text-align:center;background:linear-gradient(#05050a99,var(--bg)),var(--bgimg) center/cover;border-bottom:1px solid var(--line)}
.hero h2{font-size:clamp(30px,6vw,52px)}
.hero p{color:var(--mu);max-width:560px;margin:8px auto 0}
main{max-width:1180px;margin:0 auto;padding:24px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
.bar .sp{flex:1}
.chip{min-height:40px;padding:0 18px;border-radius:99px;border:1px solid var(--line);background:none;cursor:pointer;color:var(--mu)}
.chip.on{background:var(--p);border-color:var(--p);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .2s,transform .2s}
.item:hover{border-color:var(--p);transform:translateY(-3px)}
.item .img{aspect-ratio:16/9;background:#111 var(--bgimg) center/cover;width:100%;object-fit:cover}
.item .in{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
.item h3{font-size:22px}
.item p{margin:0;color:var(--mu);font-size:14px;flex:1}
.tag{font-size:12px;padding:2px 10px;border-radius:99px;background:#7c3aed33;color:#c4b5fd;display:inline-block}
.tag.dl{background:#34d39922;color:var(--ok)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.price{font-family:var(--hd);font-size:22px;font-weight:700}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{padding:12px;text-align:left;border-bottom:1px solid var(--line);font-size:14px}
th{color:var(--mu);font-weight:500}
.wrap{overflow-x:auto}
.st{font-size:12px;padding:2px 10px;border-radius:99px}
.st.pending{background:#f59e0b22;color:#fbbf24}.st.approved{background:#34d39922;color:var(--ok)}.st.rejected{background:#f8717122;color:var(--bad)}
dialog{background:var(--panel);color:var(--tx);border:1px solid var(--p);border-radius:14px;padding:24px;width:min(480px,94vw);box-shadow:0 0 60px #7c3aed55}
dialog::backdrop{background:#000b}
.pay{display:flex;gap:8px;margin:8px 0}
.pay label{flex:1;margin:0;border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;color:var(--tx);text-align:center}
.pay input{display:none}
.pay label:has(input:checked){border-color:var(--b);background:#3b82f622}
.note{font-size:13px;color:var(--mu);background:#0a0a14;border:1px dashed var(--line);border-radius:8px;padding:10px;margin-top:10px}
.empty{text-align:center;color:var(--mu);padding:48px 0}

#fx{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.card,main,.hero>*{position:relative;z-index:2}
header{z-index:6}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slide{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(12px)}to{opacity:1;transform:none}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes glow{0%,100%{text-shadow:0 0 18px #7c3aed}50%{text-shadow:0 0 38px #3b82f6,0 0 8px #7c3aed}}
@keyframes sheen{to{background-position:200% 0}}
@keyframes scan{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.card{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.card.shake{animation:shake .4s}
.logo h1{animation:glow 3.5s ease-in-out infinite}
#app:not(.hide){animation:fade .6s ease both}
header{animation:slide .5s ease both}
.hero h2{background:linear-gradient(90deg,#fff,#a78bfa,#60a5fa,#fff);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 6s linear infinite}
.hero p{animation:fade 1s .3s both}
.view-in>*{animation:fade .35s ease both}
.item{animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*70ms);position:relative}
.item .img{transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.item:hover .img{transform:scale(1.07)}
.item:hover{box-shadow:0 8px 40px #7c3aed44}
.item::after{content:"";position:absolute;inset:0 0 auto;height:2px;background:linear-gradient(90deg,transparent,var(--b),transparent);opacity:0;transform:translateX(-100%)}
.item:hover::after{opacity:1;animation:scan 1s ease-out}
tbody tr{animation:slide .4s ease both;animation-delay:calc(var(--i,0)*50ms);transition:background .2s}
tbody tr:hover{background:#7c3aed14}
.btn:active,.chip:active{transform:scale(.96)}
.chip{transition:background .25s,border-color .25s,color .25s,transform .15s}
.chip:hover{border-color:var(--p);color:#fff}
nav button{transition:background .25s,color .25s}
.slidein{animation:slide .3s ease both}
dialog[open]{animation:pop .3s cubic-bezier(.2,.8,.2,1) both}
dialog[open]::backdrop{animation:fade .3s ease both}
.pay label{transition:border-color .2s,background .2s,transform .15s}
.pay label:active{transform:scale(.97)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

#toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;flex-direction:column;gap:8px;max-width:min(360px,calc(100vw - 32px))}
.toast{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--b);border-radius:10px;padding:12px 14px;box-shadow:0 8px 30px #000a;font-size:14px;animation:pop .3s both;cursor:pointer}
.toast.ok{border-left-color:var(--ok)}
.toast.out{opacity:0;transform:translateX(20px);transition:opacity .3s,transform .3s}
.st.active{background:#34d39922;color:var(--ok)}.st.unused{background:#3b82f622;color:#93c5fd}.st.expired{background:#f59e0b22;color:#fbbf24}.st.revoked{background:#f8717122;color:var(--bad)}
.newtag{font-size:11px;font-weight:700;letter-spacing:.08em;padding:2px 8px;border-radius:99px;background:var(--ok);color:#052e1f;margin-left:6px;animation:glow 2s ease-in-out infinite}
code.u{font-size:12px;color:#93c5fd;word-break:break-all}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.icon{background:none;border:0;color:var(--mu);cursor:pointer;min-height:32px;padding:0 8px;border-radius:6px}
.icon:hover{color:#fff;background:#7c3aed33}
.icon.bad:hover{color:var(--bad);background:#f8717122}
.chip.app{display:inline-flex;align-items:center;gap:6px}
dialog.wide{width:min(640px,94vw)}
</style>
</head>

/* ---- code samples for authentication ---- */
function snippets(base,key,furl){
 const K=key||'YOUR-LICENSE-KEY',V=base+'/api/v1/license/validate';
 const curl=`# 1) activate / check the key (send the device HWID)
curl -X POST "${V}" \\
  -H "Content-Type: application/json" \\
  -d '{"key":"${K}","hwid":"DEVICE_HWID"}'`+(furl?`

# 2) request the field (key must be activated first)
curl "${furl}" \\
  -H "X-License-Key: ${K}" \\
  -H "X-HWID: DEVICE_HWID"`:'');
 const python=`import hashlib, winreg, requests

API = "${base}"
KEY = "${K}"

def get_hwid():
    # Windows machine GUID, hashed so the raw value never leaves the PC
    k = winreg.OpenKey(winreg.HKEY_LOCAL_MACHINE, r"SOFTWARE\\Microsoft\\Cryptography", 0,
                       winreg.KEY_READ | winreg.KEY_WOW64_64KEY)
    return hashlib.sha256(winreg.QueryValueEx(k, "MachineGuid")[0].encode()).hexdigest()

def check_license():
    r = requests.post(API + "/api/v1/license/validate",
                      json={"key": KEY, "hwid": get_hwid()}, timeout=10)
    data = r.json()
    if r.status_code != 200 or not data.get("ok"):
        raise SystemExit("License error: " + data.get("message", "unknown"))
    return data  # app, version, plan, expires_at (None = lifetime)

info = check_license()
print("Licensed:", info["app"], "v" + info["version"], "-", info["plan"])`+(furl?`

# request one field (needs the key to be activated, done above)
FIELD_URL = "${furl}"
r = requests.get(FIELD_URL, headers={"X-License-Key": KEY, "X-HWID": get_hwid()}, timeout=10)
if r.status_code != 200:
    raise SystemExit(r.json().get("message"))
value = r.json()["value"]`:'');
 const csharp=`using System;
using System.Net.Http;
using System.Security.Cryptography;
using System.Text;
using System.Text.Json;
using System.Threading.Tasks;
using Microsoft.Win32;

static class Nighthawks
{
    const string Api = "${base}";
    static readonly HttpClient Http = new HttpClient();

    // Hashed Windows machine GUID
    public static string Hwid()
    {
        using var k = RegistryKey.OpenBaseKey(RegistryHive.LocalMachine, RegistryView.Registry64)
                                 .OpenSubKey(@"SOFTWARE\\Microsoft\\Cryptography");
        var guid = (string)k.GetValue("MachineGuid");
        return Convert.ToHexString(SHA256.HashData(Encoding.UTF8.GetBytes(guid))).ToLower();
    }

    // Usage: var info = await Nighthawks.CheckLicense("${K}");
    public static async Task<JsonElement> CheckLicense(string key)
    {
        var json = JsonSerializer.Serialize(new { key, hwid = Hwid() });
        var res = await Http.PostAsync(Api + "/api/v1/license/validate",
                      new StringContent(json, Encoding.UTF8, "application/json"));
        var root = JsonDocument.Parse(await res.Content.ReadAsStringAsync()).RootElement.Clone();
        if (!res.IsSuccessStatusCode || !root.GetProperty("ok").GetBoolean())
            throw new Exception(root.GetProperty("message").GetString());
        return root; // app, version, plan, expires_at
    }`+(furl?`

    // Usage: var value = await Nighthawks.GetField("${furl}", "${K}");
    public static async Task<string> GetField(string url, string key)
    {
        var req = new HttpRequestMessage(HttpMethod.Get, url);
        req.Headers.Add("X-License-Key", key);
        req.Headers.Add("X-HWID", Hwid());
        var res = await Http.SendAsync(req);
        var root = JsonDocument.Parse(await res.Content.ReadAsStringAsync()).RootElement;
        if (!res.IsSuccessStatusCode) throw new Exception(root.GetProperty("message").GetString());
        return root.GetProperty("value").GetString();
    }`:'')+`
}`;
 const javascript=`const API = "${base}";

async function checkLicense(key, hwid) {
  const r = await fetch(API + "/api/v1/license/validate", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ key, hwid })
  });
  const data = await r.json();
  if (!r.ok || !data.ok) throw new Error(data.message);
  return data; // app, version, plan, expires_at
}

checkLicense("${K}", "DEVICE_HWID").then(console.log).catch(e => console.error(e.message));`+(furl?`

async function getField(key, hwid) {
  const r = await fetch("${furl}", {
    headers: { "X-License-Key": key, "X-HWID": hwid }
  });
  const data = await r.json();
  if (!r.ok) throw new Error(data.message);
  return data.value;
}`:'');
 return {curl,python,csharp,javascript};
}

 <div class="tabs" style="margin:12px 0 8px">${[['curl','curl'],['python','Python'],['csharp','C#'],['javascript','JavaScript']].map(([k,l],i)=>`<button type="button" class="chip ${i?'':'on'}" data-lg="${k}">${l}</button>`).join('')}</div>

/* ---- click handling (delegated, survives re-render) ---- */
$('#view').addEventListener('change',async e=>{if(e.target.id==='vsel'){verSel=e.target.value;try{await loadFields();render()}catch(x){alert(x.message)}}});
$('#view').addEventListener('click',async e=>{
 const b=e.target.closest('[data-act]');if(!b||!me||me.role!=='admin')return;
 const a=b.dataset.act,id=b.dataset.id;
 try{
  if(a==='copy')return copy(b.dataset.t);
  if(a==='cfg')return cfgDlg();
  if(a==='integ')return integDlg('');
  if(a==='lcode')return integDlg(b.dataset.t);
  if(a==='fcode')return integDlg('',b.dataset.t);
  if(a==='gen')return genDlg();
  if(a==='plan')return planDlg();
  if(a==='test')return testDlg();
  if(a==='plandel'){if(confirm('Delete this subscription? Existing keys keep their duration.')){await api('DELETE','/admin/plans/'+id);refresh()}return}
  if(a==='lhw'){if(confirm('Reset the bound HWID for this key?')){await api('POST','/admin/licenses/'+id+'/reset-hwid');refresh()}return}
  if(a==='lrev'){await api('POST','/admin/licenses/'+id+(b.dataset.st==='revoked'?'/restore':'/revoke'));refresh();return}
  if(a==='ldel'){if(confirm('Delete this key permanently?')){await api('DELETE','/admin/licenses/'+id);refresh()}return}
  if(a==='appsel'){appSel=+id;verSel='';await loadFields();render();return}
  if(a==='appnew')return appDlg();
  if(a==='vrel')return verDlg();
  if(a==='appdel'){const ap=apps.find(x=>x.id===+id);if(ap&&confirm('Delete "'+ap.name+'" and ALL its versions and fields? Existing keys stay.')){await api('DELETE','/admin/apps/'+id);appSel='';verSel='';refresh()}return}
  if(a==='fadd'){
   const ap=apps.find(x=>x.id===appSel),n=$('#fn').value.trim(),v=$('#fv').value.trim(),er=$('#ferr2');
   if(!/^[A-Za-z0-9_-]+$/.test(n)){er.textContent='Field name: letters, numbers, _ and - only.';return}
   if(!v){er.textContent='Enter a value.';return}
   await api('PUT','/admin/apps/'+ap.id+'/fields/'+encodeURIComponent(n),{value:v,public:$('#fp').checked});refresh();return}
  if(a==='fdel'){if(confirm('Remove this field?')){await api('DELETE','/admin/apps/'+appSel+'/fields/'+encodeURIComponent(id));refresh()}return}
 }catch(x){alert(x.message)}
});

/* ====== Discord: many channels, per-event routing, custom messages (webhooks live on the backend) ====== */
async function discordItemEvent(old,o){
 try{
  if(!dc||!dc.channels||!dc.channels.length||!apiCfg().url)return;
  let event;
  if(!old.id)event='new_item';
  else if(o.type==='sale'&&(String(old.priceFJD||'')!==String(o.priceFJD||'')||String(old.priceUSDT||'')!==String(o.priceUSDT||'')))event='price_change';
  else return;
  if(event==='new_item'&&(!dc.notify_new_item||!dc.routes.new_item.length))return;
  if(event==='price_change'&&(!dc.notify_price_change||!dc.routes.price_change.length))return;
  const r=await api('POST','/admin/discord/notify',{event,title:o.title,category:o.cat,type:o.type,price_fjd:o.priceFJD,price_usdt:o.priceUSDT,old_fjd:old.priceFJD||'',old_usdt:old.priceUSDT||'',description:o.desc||'',store_url:location.href.split('#')[0]});
  if(r.sent)toast('📣 Posted to '+r.sent+' Discord channel'+(r.sent>1?'s':''),'ok');
 }catch(e){toast('Discord post failed: '+e.message)}
}
function discordHTML(){
 if(v2Err)return `<div class="empty">${esc(v2Err)}<div style="margin-top:16px">${cfgBtn}</div></div>`;
 if(!dc||!dc.channels)return `<div class="empty">Your backend does not have the latest Discord feature yet. Upload the newest app.py and press Reload on PythonAnywhere.<div style="margin-top:16px">${cfgBtn}</div></div>`;
 const chk='style="width:auto;min-height:0"',lbl='style="display:flex;align-items:center;gap:6px;color:var(--tx);margin:0"';
 const boxes=(attr,key)=>dc.channels.length?dc.channels.map(c=>`<label ${lbl}><input type="checkbox" ${attr} value="${esc(c.id)}" ${key&&dc.routes[key].includes(c.id)?'checked':''} ${chk}> ${esc(c.name)}</label>`).join(''):'<span style="color:var(--mu);font-size:14px">Add a channel first.</span>';
 return `<div class="bar"><h2 style="font-size:26px">Discord</h2><span class="tag">${dc.channels.length} channel${dc.channels.length===1?'':'s'}</span><span class="sp"></span>${cfgBtn}</div>
 <div class="note" style="margin:0 0 12px">Each Discord channel has its own webhook (Channel settings → Integrations → Webhooks). Webhook URLs are saved on your backend only and are never shown again.</div>
 <h3 style="font-size:22px;margin:8px 0">Channels</h3>
 ${dc.channels.length?`<div class="wrap"><table><thead><tr><th>Name</th><th>Webhook</th><th></th></tr></thead><tbody>${dc.channels.map(c=>`<tr><td>${esc(c.name)}</td><td class="mono">${esc(c.masked)}</td><td style="white-space:nowrap"><button type="button" class="icon" data-act="chtest" data-id="${esc(c.id)}">Test</button><button type="button" class="icon" data-act="chedit" data-id="${esc(c.id)}">Edit</button><button type="button" class="icon bad" data-act="chdel" data-id="${esc(c.id)}">Remove</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty" style="padding:16px">No channels yet.</div>'}
 <div class="row" style="margin-top:12px;align-items:flex-end"><div style="flex:1;min-width:140px"><label for="cn" style="margin-top:0">Channel name</label><input id="cn" maxlength="40" placeholder="#announcements" autocomplete="off"></div><div style="flex:2;min-width:220px"><label for="cw" style="margin-top:0">Webhook URL</label><input id="cw" type="password" placeholder="https://discord.com/api/webhooks/ID/TOKEN" autocomplete="off"></div><button type="button" class="btn" data-act="chadd">+ Add channel</button></div>
 <div class="err" id="derr" role="alert"></div>
 <h3 style="font-size:22px;margin:24px 0 8px">Automatic announcements</h3>
 <div class="note" style="margin:0 0 10px"><label ${lbl}><input type="checkbox" id="dn1" ${chk} ${dc.notify_new_item?'checked':''}> <b>New store item</b></label><div class="row" style="margin-top:8px">${boxes('data-rt="new_item"','new_item')}</div></div>
 <div class="note" style="margin:0 0 10px"><label ${lbl}><input type="checkbox" id="dn2" ${chk} ${dc.notify_price_change?'checked':''}> <b>Price change</b></label><div class="row" style="margin-top:8px">${boxes('data-rt="price_change"','price_change')}</div></div>
 <div class="note" style="margin:0">Tick the channels each announcement should go to. Posts show the title, category and price only. Download links are never posted.</div>
 <h3 style="font-size:22px;margin:24px 0 8px">Send a message</h3>
 <label>Send to</label><div class="row">${boxes('data-sc','')}</div>
 <label for="dt">Title (optional, makes it a styled card)</label><input id="dt" maxlength="200">
 <label for="dm">Message</label><textarea id="dm" maxlength="2000" rows="5"></textarea>
 <label style="display:flex;align-items:center;gap:8px;color:var(--tx)"><input type="checkbox" id="dp" ${chk}> Allow @everyone / @here / role pings</label>
 <div class="row" style="margin-top:12px"><button type="button" class="btn" data-act="dsend">Send to Discord</button></div>`;
}
function chDlg(id){
 const c=dc.channels.find(x=>x.id===+id);if(!c)return;dlg.className='';
 dlg.innerHTML=`<h2>Edit channel</h2><label for="e1">Name</label><input id="e1" maxlength="40" value="${esc(c.name)}">
 <label for="e2">New webhook URL (leave empty to keep the saved one)</label><input id="e2" type="password" autocomplete="off" placeholder="${esc(c.masked)}">
 <div class="err" id="ferr" role="alert"></div>
 <div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn ghost" id="x" type="button">Cancel</button><button class="btn" id="sv" type="button">Save</button></div>`;
 dlg.showModal();$('#x').onclick=()=>dlg.close();
 $('#sv').onclick=async()=>{const b={name:$('#e1').value.trim()},u=$('#e2').value.trim();if(u)b.webhook_url=u;
  try{dc=await api('PUT','/admin/discord/channels/'+c.id,b);dlg.close();render()}catch(e){$('#ferr').textContent=e.message}};
}
$('#view').addEventListener('change',async e=>{
 if(me?.role!=='admin')return;const t=e.target;let b;
 if(t.id==='dn1')b={notify_new_item:t.checked};
 else if(t.id==='dn2')b={notify_price_change:t.checked};
 else if(t.dataset&&t.dataset.rt){const k=t.dataset.rt;b={['route_'+k]:[...document.querySelectorAll('[data-rt="'+k+'"]:checked')].map(x=>+x.value)}}
 else return;
 try{dc=await api('PUT','/admin/discord',b);toast('Saved','ok')}catch(x){alert(x.message);refresh()}
});
$('#view').addEventListener('click',async e=>{
 const b=e.target.closest('[data-act]');if(!b||!me||me.role!=='admin')return;
 const a=b.dataset.act,id=b.dataset.id;if(!['chadd','chedit','chtest','chdel','dsend'].includes(a))return;
 const er=$('#derr');if(er)er.textContent='';
 try{
  if(a==='chedit')return chDlg(id);
  if(a==='chadd'){const name=$('#cn').value.trim(),url=$('#cw').value.trim();if(!name||!url){er.textContent='Enter a channel name and its webhook URL.';return}dc=await api('POST','/admin/discord/channels',{name,webhook_url:url});toast('Channel added','ok');render();return}
  if(a==='chtest'){await api('POST','/admin/discord/channels/'+id+'/test');toast('Test message sent','ok');return}
  if(a==='chdel'){if(confirm('Remove this channel? Automatic posts to it will stop.')){dc=await api('DELETE','/admin/discord/channels/'+id);render()}return}
  if(a==='dsend'){
   const ids=[...document.querySelectorAll('[data-sc]:checked')].map(x=>+x.value),content=$('#dm').value.trim(),title=$('#dt').value.trim();
   if(!ids.length){er.textContent='Pick at least one channel to send to.';return}
   if(!content&&!title){er.textContent='Write a message first.';return}
   b.disabled=true;try{const r=await api('POST','/admin/discord/send',{channel_ids:ids,content,title,allow_mentions:$('#dp').checked});toast('📣 Sent to '+r.sent+' channel'+(r.sent>1?'s':''),'ok');$('#dm').value='';$('#dt').value=''}finally{b.disabled=false}return}
 }catch(x){if(er)er.textContent=x.message;else alert(x.message)}
});

/* ---- particle system ---- */
(function(){
 const cv=$('#fx'),cx=cv.getContext('2d');
 const still=matchMedia('(prefers-reduced-motion:reduce)').matches;
 const m={x:-999,y:-999};let W,H,P=[],raf;
 const cols=['124,58,237','59,130,246','167,139,250','96,165,250'];
 function size(){
  const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0);
  const n=Math.min(90,Math.floor(W*H/15000));
  P=Array.from({length:n},()=>mk(true));
 }
 function mk(any){return{x:Math.random()*W,y:any?Math.random()*H:H+10,vx:(Math.random()-.5)*.3,vy:-(.15+Math.random()*.45),r:.8+Math.random()*2,c:cols[Math.random()*4|0],a:.25+Math.random()*.6,t:Math.random()*6.28}}
 function frame(){
  cx.clearRect(0,0,W,H);
  for(let i=0;i<P.length;i++){
   const p=P[i];
   if(!still){
    p.t+=.02;p.x+=p.vx+Math.sin(p.t)*.15;p.y+=p.vy;
    const dx=p.x-m.x,dy=p.y-m.y,d=dx*dx+dy*dy;
    if(d<14400){const f=(1-Math.sqrt(d)/120)*1.6,l=Math.sqrt(d)||1;p.x+=dx/l*f;p.y+=dy/l*f}
    if(p.y<-10||p.x<-10||p.x>W+10)P[i]=mk(false),P[i].x=Math.random()*W;
   }
   const tw=.6+.4*Math.sin(p.t*2);
   cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.283);
   cx.fillStyle=`rgba(${p.c},${p.a*tw})`;cx.shadowColor=`rgb(${p.c})`;cx.shadowBlur=8;cx.fill();cx.shadowBlur=0;
   for(let j=i+1;j<P.length;j++){
    const q=P[j],dx=p.x-q.x,dy=p.y-q.y,d=dx*dx+dy*dy;
    if(d<10000){cx.strokeStyle=`rgba(${p.c},${(1-d/10000)*.22})`;cx.lineWidth=.6;cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(q.x,q.y);cx.stroke()}
   }
  }
  if(!still)raf=requestAnimationFrame(frame);
 }
 addEventListener('pointermove',e=>{m.x=e.clientX;m.y=e.clientY},{passive:true});
 addEventListener('pointerleave',()=>{m.x=m.y=-999});
 addEventListener('resize',()=>{size();if(still)frame()});
 document.addEventListener('visibilitychange',()=>{cancelAnimationFrame(raf);if(!document.hidden&&!still)frame()});
 size();frame();
})();
</script>
